##--------------------------------------------------------------------
##  B Stepper - Left
##  Connected to MOTOR_0
##  Endstop connected to DIAG_0
##--------------------------------------------------------------------
[stepper_x]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: tmc2209_stepper_x:virtual_endstop # endstop_pin: PG6
position_min: 0

position_endstop: 350
position_max: 350

homing_speed: 40   #Max 100, Default 25
homing_retract_dist: 0 #Default 5
homing_positive_dir: true

##--------------------------------------------------------------------
##  A Stepper - Right
##  Connected to MOTOR_1
##  Endstop connected to DIAG_1
##--------------------------------------------------------------------
[stepper_y]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: tmc2209_stepper_y:virtual_endstop # endstop_pin: PG9
position_min: 0

position_endstop: 350
position_max: 350

homing_speed: 40  #Max 100, Default 25
homing_retract_dist: 0 # Default 5
homing_positive_dir: true

##--------------------------------------------------------------------
##  Make sure to update below for your relevant driver (2208 or 2209)
##--------------------------------------------------------------------
[tmc2209 stepper_x]
uart_pin: PC4
interpolate: false
run_current: 1.2
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^PG6
driver_SGTHRS: 0 #255 most sensitive 0 is least sensitive

##--------------------------------------------------------------------
##  Make sure to update below for your relevant driver (2208 or 2209)
##--------------------------------------------------------------------
[tmc2209 stepper_y]
uart_pin: PD11
interpolate: false
run_current: 1.2
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^PG9
driver_SGTHRS: 0 #255 most sensitive 0 is least sensitive