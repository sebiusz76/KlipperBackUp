## ======================================================================================================================
## Use PRINT_START for the slicer starting script - please customise for your slicer of choice test
## ======================================================================================================================
[gcode_macro PRINT_START]
gcode:
  {% set BED = params.BED_TEMP|int %}
  {% set EXTRUDER = params.EXTRUDER_TEMP|int %}  
  EXTENDED_RESPOND MSG="Set bed temperature and wait" COLOR="info"
  M190 S{BED}  ;Set bed temperature and wait  
  EXTENDED_RESPOND MSG="Home all axes if not homed" COLOR="info"
  _CHOME  ;Home all axes if not homed  
  EXTENDED_RESPOND MSG="Quad Gantry Level if not done" COLOR="info"
  _CQGL  ;Quad Gantry Level if not done  
  EXTENDED_RESPOND MSG="Clear Bed Mesh" COLOR="info"
  BED_MESH_CLEAR  ;Clear Bed Mesh  
  EXTENDED_RESPOND MSG="Bed Mesh Calibration" COLOR="info"
  BED_MESH_CALIBRATE  ;Bed Mesh Calibration  
  EXTENDED_RESPOND MSG="Probe calibration" COLOR="info"
  PROBE_CALIBRATE METHOD=AUTO  ;Custom command
  _MOVE_TO_ZERO  
  EXTENDED_RESPOND MSG="Set extruder temperature and wait" COLOR="info"
  M109 S{EXTRUDER}  ;Set extruder temperature and wait
  EXTENDED_RESPOND MSG="Front Purge Line" COLOR="info"
  _PURGE_LINE  ;Front Purge


[gcode_macro M190]
rename_existing: M190.1
gcode:
  {% if printer["gcode_macro status_heating"] != null %}
    status_heating
  {% endif %}
    M190.1 { rawparams }
  {% if printer["gcode_macro status_ready"] != null %}
    status_ready
  {% endif %}

[gcode_macro _CHOME]
gcode:
  {% if printer["gcode_macro status_homing"] != null %}
    status_homing
  {% endif %}
  {% if printer.toolhead.homed_axes != "xyz" %}
  G28
  {% endif %}
  {% if printer["gcode_macro status_ready"] != null %}
    status_ready
  {% endif %}

[gcode_macro _CQGL]
gcode:
  {% if printer.quad_gantry_level.applied == False %}
      {% if "xyz" not in printer.toolhead.homed_axes %}
          G28 ; home if not already homed
      {% endif %}
      {% if printer["gcode_macro status_leveling"] != null %}
        status_leveling
      {% endif %}
      QUAD_GANTRY_LEVEL
      G28 Z
  {% endif %}
  {% if printer["gcode_macro status_ready"] != null %}
    status_ready
  {% endif %}

[gcode_macro M109]
rename_existing: M109.1
gcode:
  {% if printer["gcode_macro status_heating"] != null %}
    status_heating
  {% endif %}
    M109.1 { rawparams }
  {% if printer["gcode_macro status_ready"] != null %}
    status_ready
  {% endif %}


[gcode_macro _PURGE_LINE]
gcode:
  {% if printer["gcode_macro status_cleaning"] != null %}
    status_cleaning
  {% endif %}
  SAVE_GCODE_STATE NAME=Pre_Prime
        
  G90
  G92 E0 ;Reset Extruder

  G1 Z10.0 F3000 ;Move Z Axis up
  G1 X0 Y0;
  G1 E10.0 F1800
  G1 Z0.28 F5000.0 ;Move to start position
  G1 X220 Y0 Z0.28 F1500.0 E30 ;Draw the first line
  G92 E0 ;Reset Extruder
  G1 Z10 F3000 ;Move Z Axis up
  RESTORE_GCODE_STATE NAME=Pre_Prime

  {% if printer["gcode_macro status_printing"] != null %}
    status_printing
  {% endif %}

[gcode_macro _MOVE_TO_ZERO]
gcode:
  G1 Z10.0 F3000 ;Move Z Axis up
  G1 X0 Y0 ;Move to position X0, Y0
