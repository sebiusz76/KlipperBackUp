[gcode_macro move_test]
gcode:    
    G32                            ; home all axes
    G90                            ; absolute positioning
    G1 Z30 F3000                   ; move nozzle away from bed

    _CLIENT_LINEAR_MOVE X=10 Y=10 F=3000 ABSOLUTE=1

    {% for i in range(10) %}
        _CLIENT_LINEAR_MOVE X=340 Y=10 F=3000 ABSOLUTE=1
        _CLIENT_LINEAR_MOVE X=10 Y=10 F=3000 ABSOLUTE=1
    {% endfor %}