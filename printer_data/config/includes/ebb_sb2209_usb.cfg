[extruder]
step_pin: EBB:gpio18
dir_pin: !EBB:gpio19
enable_pin: !EBB:gpio17
microsteps: 32
gear_ratio: 50:17
rotation_distance: 13.59765
nozzle_diameter: 0.400
pressure_advance: 0.055
filament_diameter: 1.750
heater_pin: EBB:gpio7
pullup_resistor: 2200 # 2.2K
sensor_type: PT1000 #sensor_type: EPCOS 100K B57560G104F
sensor_pin: EBB:gpio26
control: pid
pid_Kp: 33.643
pid_Ki: 2.639
pid_Kd: 107.233
min_extrude_temp: 20
min_temp: 0
max_temp: 290

[tmc2209 extruder]
uart_pin: EBB:gpio20
run_current: 0.350 #run_current: 0.650
stealthchop_threshold: 999999

[fan] # fan1
pin: EBB:gpio14

[heater_fan hotend_fan] # fan2
pin: EBB:gpio4
heater: extruder
heater_temp: 40.0

[neopixel hotend_rgb]
pin: EBB:gpio15
chain_count: 3
color_order: GRBW, GRBW, GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0
