[mcu idm]
serial: /dev/serial/by-id/usb-IDM_614e_14001F000F4330344E333720-if00
#canbus_uuid:
# Path to the serial port for the IDM device. Typically has the form
# /dev/serial/by-id/usb-idm_idm_...

[scanner]
#canbus_uuid: 0ca8d67388c2      
mcu: idm
# mcu of IDM
x_offset: 0                          
# Adjust for your cartographer's offset from the nozzle to the middle of the coil.
y_offset: 15                         
# Adjust for your cartographer's offset from the nozzle to the middle of the coil.
backlash_comp: 0.5
# Backlash compensation distance for removing Z backlash before measuring
# the sensor response.
#
# Offsets are measured from the center of your coil to the tip of your nozzle
# on a level axis. It is vital that this is accurate.
calibration_method: touch
# Leave this as "touch" unless you want to use "scan only" for everything.
sensor: idm
# This must be set to "cartographer" unless using IDM etc.
scanner_touch_z_offset: 0.05         
# This is the default and will be overwritten and added to the DO NOT SAVE area by using the UI to save Z offset.
#mesh_runs: 1
# Number of passes to make during the mesh scan.

[force_move]
enable_force_move: true

[stepper_z]
endstop_pin: probe:z_virtual_endstop
homing_retract_dist: 0 # idm needs this to be set to 0
# position_endstop: 

[stepper_z1]
endstop_pin: probe:z_virtual_endstop

[stepper_z2]
endstop_pin: probe:z_virtual_endstop

[stepper_z3]
endstop_pin: probe:z_virtual_endstop

#[safe_z_home]
#home_xy_position: 100,100 # your X,Y axis center coordinates
#z_hop: 10

[bed_mesh]
speed: 120
mesh_min: 35, 6
mesh_max: 240, 198
probe_count: 5, 3
zero_reference_position: 150, 150    
# Set this to the middle of your bed.

[lis2dw]
cs_pin: idm:PA3
spi_bus: spi1

[resonance_tester]
accel_chip: lis2dw
probe_points:
    125, 125, 20  #set your preferred calibrating position