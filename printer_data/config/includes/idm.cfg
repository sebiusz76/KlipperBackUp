[mcu idm]
serial: /dev/serial/by-id/usb-IDM_614e_14001F000F4330344E333720-if00

[scanner]
mcu: idm # mcu of IDM
x_offset: 0 # Adjust for your cartographer's offset from the nozzle to the middle of the coil.
y_offset: 15 # Adjust for your cartographer's offset from the nozzle to the middle of the coil.
backlash_comp: 0.5 # Backlash compensation distance for removing Z backlash before measuring the sensor response.
calibration_method: scan # Leave this as "touch" unless you want to use "scan only" for everything.
sensor: idm # This must be set to "cartographer" unless using IDM etc.
scanner_touch_z_offset: 0.05 # This is the default and will be overwritten and added to the DO NOT SAVE area by using the UI to save Z offset.
mesh_runs: 1 # Number of passes to make during the mesh scan.

[bed_mesh]
speed: 120
mesh_min: 25, 25
mesh_max: 325, 325
algorithm: bicubic
probe_count: 20, 20
zero_reference_position: 175, 175 # Set this to the middle of your bed.

[lis2dw]
cs_pin: idm:PA3
spi_bus: spi1
axes_map: x,-y,-z

[resonance_tester]
accel_chip: lis2dw
probe_points: 175, 175, 20  #set your preferred calibrating position