[neopixel caselight]
pin: PB0
chain_count: 40
color_order: GRB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0

[led_effect set_caselight]
leds:
    neopixel:caselight (1-50)
autostart: false
layers:
    static         0  0     top        (1.0,  1.0, 1.0)

[gcode_macro caselight_leds_on]
gcode:
    SET_LED_EFFECT EFFECT=set_caselight
    

[gcode_macro caselight_leds_off]
gcode:
    SET_LED_EFFECT EFFECT=set_caselight STOP=1
    
